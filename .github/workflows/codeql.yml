# CodeQL scans the Python code for security issues. It runs on
# every push to main, every pull request, and once a week on
# schedule. Results appear under Security > Code scanning alerts.
# No code changes needed: it reads the repo as it is.
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
