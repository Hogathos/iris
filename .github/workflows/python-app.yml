# This workflow runs the tests and lint on a matrix of operating
# systems and Python versions. The matrix is the platform test:
# one OS and one Python version is not a matrix.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    strategy:
      # Fail-fast off: a failing combo must not hide the other eight.
      # The matrix reports green per combo, not green overall.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # The install step uses bash test syntax. Windows runners
        # default to PowerShell, so pin bash on every OS.
        shell: bash

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pyright flake8 pytest hypothesis fastapi uvicorn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with Ruff
      run: |
        # stop the build on hard errors only (ruff.toml: E9, F63, F7, F82)
        ruff check . --statistics
        # the rest is warnings only, never a build failure
        ruff check . --select=E,F --exit-zero --statistics
    - name: Lint with flake8
      # always runs so both linters report, even if Ruff failed
      if: always()
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Type-check with Pyright
      run: |
        pyright
    - name: Test with unittest
      env:
        PYTHONPATH: .
      run: |
        python -m unittest discover -s tests -v
    - name: Test with pytest
      # always runs so both suites report, even if unittest failed
      if: always()
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -q
