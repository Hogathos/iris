# This workflow runs the tests and lint. The matrix is tiered by
# task: pull requests run a small subset for fast feedback, and
# pushes to main run the full matrix for complete coverage. A
# pull request that touches only watcher scripts runs a single
# job, because the watcher is pure standard library with no Qt
# and no platform code. A pull request that touches
# platform-sensitive code (Qt, packaging, teardown,
# Windows-specific) gets the full matrix too, by running this
# workflow manually on its branch
# (Actions > Python application > Run workflow).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # Pull requests only. Works out whether the PR touches only
    # watcher scripts. The minimal and quick jobs read this.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      watcher-only: ${{ steps.check.outputs.watcher-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          watcher_only=true
          for f in $files; do
            case "$f" in
              tools/bridge_watcher*|tests/test_bridge_watcher.py|prompts/bridge-watcher-*.md) ;;
              *) watcher_only=false ;;
            esac
          done
          echo "watcher-only=$watcher_only" >> "$GITHUB_OUTPUT"

  build-minimal:
    # Pull requests that touch only watcher scripts. One run:
    # Ubuntu on Python 3.12. The watcher is pure standard
    # library, so one run catches syntax, test, and lint failures.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.watcher-only == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # The install step uses bash test syntax. Windows runners
        # default to PowerShell, so pin bash on every OS.
        shell: bash

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Qt system libraries (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxi6 libxtst6 libgtk-3-0 libglib2.0-0 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pyright pytest hypothesis fastapi uvicorn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with Ruff
      run: |
        # stop the build on hard errors only (ruff.toml: E9, F63, F7, F82)
        ruff check . --statistics
        # the rest is warnings only, never a build failure
        ruff check . --select=E,F --exit-zero --statistics
    - name: Check formatting with Ruff
      run: |
        ruff format --check .
    - name: Type-check with Pyright
      run: |
        pyright
    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -q

  build-quick:
    # Pull requests that touch anything besides watcher scripts.
    # Five runs: all three OS on Python 3.12, plus the oldest
    # and newest Python on Ubuntu. This catches OS-specific and
    # Python-version issues without running all 15.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.watcher-only != 'true'
    strategy:
      # Fail-fast off: a failing combo must not hide the others.
      # The matrix reports green per combo, not green overall.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # The install step uses bash test syntax. Windows runners
        # default to PowerShell, so pin bash on every OS.
        shell: bash

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Qt system libraries (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxi6 libxtst6 libgtk-3-0 libglib2.0-0 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pyright pytest hypothesis fastapi uvicorn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with Ruff
      run: |
        # stop the build on hard errors only (ruff.toml: E9, F63, F7, F82)
        ruff check . --statistics
        # the rest is warnings only, never a build failure
        ruff check . --select=E,F --exit-zero --statistics
    - name: Check formatting with Ruff
      run: |
        ruff format --check .
    - name: Type-check with Pyright
      run: |
        pyright
    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -q

  build-full:
    # Pushes to main, and manual runs on any branch. The full
    # matrix: three OS times five Python versions, fifteen runs.
    # The matrix is the platform test: one OS and one Python
    # version is not a matrix.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      # Fail-fast off: a failing combo must not hide the other fourteen.
      # The matrix reports green per combo, not green overall.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # The install step uses bash test syntax. Windows runners
        # default to PowerShell, so pin bash on every OS.
        shell: bash

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Qt system libraries (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxi6 libxtst6 libgtk-3-0 libglib2.0-0 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pyright pytest hypothesis fastapi uvicorn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with Ruff
      run: |
        # stop the build on hard errors only (ruff.toml: E9, F63, F7, F82)
        ruff check . --statistics
        # the rest is warnings only, never a build failure
        ruff check . --select=E,F --exit-zero --statistics
    - name: Check formatting with Ruff
      run: |
        ruff format --check .
    - name: Type-check with Pyright
      run: |
        pyright
    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -q
