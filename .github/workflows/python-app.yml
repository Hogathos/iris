# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pyright pytest hypothesis fastapi uvicorn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with Ruff
      run: |
        # stop the build on hard errors only (ruff.toml: E9, F63, F7, F82)
        ruff check . --statistics
        # the rest is warnings only, never a build failure
        ruff check . --select=E,F --exit-zero --statistics
    - name: Type-check with Pyright
      run: |
        pyright
    - name: Test with unittest
      env:
        PYTHONPATH: .
      run: |
        python -m unittest discover -s tests -v
    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -q
